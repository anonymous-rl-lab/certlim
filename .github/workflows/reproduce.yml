name: Verify TII v25 and certlim
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the clean checkout and the release checker
        run: |
          python reproduce.py verify
          python -B support/test_release_files.py
      - name: Install the audited wheel and exercise the published interfaces
        run: |
          python -m pip install -r requirements-capacity.txt matplotlib==3.10.8 pytest
          python -m pip install --no-index --no-deps packages/certlim-0.2.1-py3-none-any.whl
          python reproduce.py verify-tool
          python -m tarfile -e packages/certlim-0.2.1.tar.gz "$RUNNER_TEMP"
          python -I -m pytest -p no:cacheprovider -q "$RUNNER_TEMP/certlim-0.2.1/tests"
      - name: Rebuild the NASA tables and verify the historical snapshot
        run: |
          python -m pip install pyarrow
          python reproduce.py nasa --work-dir "$RUNNER_TEMP/nasa-runs"
          python reproduce.py legacy-workspace "$RUNNER_TEMP/legacy"
          python "$RUNNER_TEMP/legacy/reproduce.py" --tier verify
          python reproduce.py verify
