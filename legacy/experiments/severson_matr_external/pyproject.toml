[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "severson-matr-external-gate"
version = "0.1.0"
description = "External evidence-value and certification gate on Severson/MATR cells"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
