[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jones-eis-external-gates"
version = "0.2.0"
description = "External Jones EIS gates for finite-evidence causal safety certification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=1.5,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
